# Backend deployment blueprint. Requires a MongoDB connection and a configured email provider.
services:
  - type: web
    name: habit-hero-api
    runtime: python
    rootDir: original/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DB_NAME
        value: habit_hero
      - key: MONGO_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: BASE_URL
        sync: false
