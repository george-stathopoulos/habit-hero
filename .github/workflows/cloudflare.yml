name: Build and deploy Cloudflare Habit Hero
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Cloudflare routing and fail-closed API
        run: |
          node --check cloudflare/worker.mjs
          node --check cloudflare/google-auth.mjs
          node scripts/test-cloudflare.mjs
          node scripts/test-google-auth.mjs
          node --check cloudflare/family-api.mjs
          node --check cloudflare/parent-page.mjs
          node scripts/test-family-api.mjs
          node --check cloudflare/habits-api.mjs
          node scripts/test-habits-api.mjs
          node --check cloudflare/activity-api.mjs
          node scripts/test-activity-api.mjs
          node --check cloudflare/child-auth.mjs
          node --check cloudflare/child-pin.mjs
          node --check cloudflare/pin-hash.mjs
          node --check cloudflare/household-auth.mjs
          node --check cloudflare/household-page.mjs
          node --check cloudflare/child-page.mjs
          node --check cloudflare/rewards-api.mjs
          node --check cloudflare/progress-api.mjs
          node --check cloudflare/occurrence.mjs
          node --check cloudflare/export-api.mjs
          node --check cloudflare/points-api.mjs
          node --check cloudflare/timezone.mjs
          node scripts/test-occurrence.mjs
          node scripts/test-child-auth.mjs
          node scripts/test-child-pin.mjs
          node scripts/test-parent-pin.mjs
          node scripts/test-pin-roundtrip.mjs
          node scripts/test-household.mjs
          node scripts/test-mobile-app.mjs
          python3 scripts/generate-icons.py
          python3 scripts/prepare-original-assets.py
      - name: Build original Expo app for Cloudflare
        working-directory: original/frontend
        env:
          CI: "1"
          EXPO_PUBLIC_BACKEND_URL: ""
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx expo export --platform web --clear
          node ../../scripts/repair-original-web.cjs
          node --check dist/_expo/static/js/web/entry-*.js
      - name: Stage Cloudflare static assets
        run: |
          mkdir -p cloudflare-dist/habit-hero/app cloudflare-dist/habit-hero/original-preview
          cp index.html site.css cloudflare-dist/habit-hero/
          cp -a app/. cloudflare-dist/habit-hero/app/
          cp -a original/frontend/dist/. cloudflare-dist/habit-hero/original-preview/
          cp cloudflare-dist/habit-hero/original-preview/index.html cloudflare-dist/habit-hero/original-preview/404.html
          python3 scripts/add-original-pwa.py cloudflare-dist/habit-hero/original-preview
          test -f cloudflare-dist/habit-hero/index.html
          test -f cloudflare-dist/habit-hero/original-preview/index.html
      - name: Upload Cloudflare-ready artifact
        uses: actions/upload-artifact@v4
        with:
          name: habit-hero-cloudflare
          path: cloudflare-dist/
      - name: Install additive family timezone table before Worker rollout
        if: ${{ vars.HABIT_HERO_CLOUDFLARE_DEPLOY == 'true' }}
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '3fc2c10ca86a2322b58f7daa16c77c6d' }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4 d1 execute habit-hero-db --remote --file ./migrations/0002_family_timezone.sql
          npx --yes wrangler@4 d1 execute habit-hero-db --remote --command "SELECT name FROM pragma_table_info('auth_sessions') WHERE name='pin_verified_at';" --json > ../pin-column-check.json
          if node -e 'const r=require("../pin-column-check.json");process.exit(JSON.stringify(r).includes("pin_verified_at")?0:1)'; then
            echo "PIN session column already installed"
          else
            npx --yes wrangler@4 d1 execute habit-hero-db --remote --file ./migrations/0003_child_pin.sql
          fi
      - name: Install shared-device PIN schema
        if: ${{ vars.HABIT_HERO_CLOUDFLARE_DEPLOY == 'true' }}
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '3fc2c10ca86a2322b58f7daa16c77c6d' }}
        run: |
          npx --yes wrangler@4 d1 execute habit-hero-db --remote --command "SELECT name FROM pragma_table_info('parent_users') WHERE name='pin_hash';" --json > ../parent-pin-check.json
          if node -e 'const r=require("../parent-pin-check.json");process.exit(JSON.stringify(r).includes("pin_hash")?0:1)'; then
            echo "Household schema already installed"
          else
            npx --yes wrangler@4 d1 execute habit-hero-db --remote --file ./migrations/0004_shared_device.sql
          fi
      - name: Install mission help request schema
        if: ${{ vars.HABIT_HERO_CLOUDFLARE_DEPLOY == 'true' }}
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '3fc2c10ca86a2322b58f7daa16c77c6d' }}
        run: |
          npx --yes wrangler@4 d1 execute habit-hero-db --remote --file ./migrations/0005_help_requests.sql
      - name: Install repeatable habit occurrence slots
        if: ${{ vars.HABIT_HERO_CLOUDFLARE_DEPLOY == 'true' }}
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '3fc2c10ca86a2322b58f7daa16c77c6d' }}
        run: |
          npx --yes wrangler@4 d1 execute habit-hero-db --remote --command "SELECT name FROM pragma_table_info('completion_submissions') WHERE name='slot_index';" --json > ../slot-column-check.json
          if node -e 'const r=require("../slot-column-check.json");process.exit(JSON.stringify(r).includes("slot_index")?0:1)'; then
            echo "Repeatable habit slots already installed"
          else
            npx --yes wrangler@4 d1 execute habit-hero-db --remote --file ./migrations/0006_frequency_slots.sql
          fi
      - name: Deploy using existing Cloudflare account
        if: ${{ vars.HABIT_HERO_CLOUDFLARE_DEPLOY == 'true' }}
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '3fc2c10ca86a2322b58f7daa16c77c6d' }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set repository variable CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          node -e 'const fs=require("fs"); const p="wrangler.jsonc"; const d=JSON.parse(fs.readFileSync(p,"utf8")); d.vars={...d.vars,APP_VERSION:process.env.GITHUB_SHA}; fs.writeFileSync(p,JSON.stringify(d,null,2));'
          npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Verify live D1-backed API health
        if: ${{ vars.HABIT_HERO_CLOUDFLARE_DEPLOY == 'true' }}
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 3 --retry-all-errors \
            https://habit-hero-cloudflare.george-stathopoulos.workers.dev/api/health \
            | node -e 'const assert=require("node:assert/strict");let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const x=JSON.parse(s);assert.equal(x.status,"ok");assert.equal(x.database,"connected");assert.equal(x.featuresEnabled,false);console.log("Verified remote D1 connectivity without enabling customer API");});'

      - name: Verify Google OIDC initiation on deployed Worker
        if: ${{ vars.HABIT_HERO_CLOUDFLARE_DEPLOY == 'true' }}
        run: |
          status=$(curl --silent --show-error --retry 3 --retry-delay 3 --max-redirs 0 \
            -o /dev/null -w '%{http_code}' \
            "https://habit-hero-cloudflare.george-stathopoulos.workers.dev/api/auth/google/start")
          test "$status" = "302" || { echo "::error::Google OIDC initiation returned HTTP $status, expected 302"; exit 1; }
          echo "Verified Google OIDC start endpoint redirects to Google without exposing credentials"

      - name: Verify live Google SSO return page is reachable
        if: ${{ vars.HABIT_HERO_CLOUDFLARE_DEPLOY == 'true' }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            -D /tmp/hero-callback-headers.txt \
            -o /tmp/hero-callback.html \
            "https://habit-hero-cloudflare.george-stathopoulos.workers.dev/habit-hero/original-preview/auth/google-callback"
          grep -qi 'content-type: text/html' /tmp/hero-callback-headers.txt
          grep -q "Επαλήθευση σύνδεσης" /tmp/hero-callback.html
          grep -q "/api/auth/me" /tmp/hero-callback.html
          echo "Verified live SSO landing HTML (unauthenticated browser will prompt re-login)"

      - name: Verify deployed parent dashboard and protected family API
        if: ${{ vars.HABIT_HERO_CLOUDFLARE_DEPLOY == 'true' }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            "https://habit-hero-cloudflare.george-stathopoulos.workers.dev/habit-hero/parent/" \
            | grep -q "/api/family/overview"
          status=$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
            "https://habit-hero-cloudflare.george-stathopoulos.workers.dev/api/family/overview")
          test "$status" = "401" || { echo "::error::Unauthenticated family API returned HTTP $status"; exit 1; }
          echo "Parent page accessible; private API rejects anonymous requests"

      - name: Verify deployed habit management guardrails
        if: ${{ vars.HABIT_HERO_CLOUDFLARE_DEPLOY == 'true' }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            "https://habit-hero-cloudflare.george-stathopoulos.workers.dev/habit-hero/parent/" \
            | grep -q 'id="habitForm"'
          status=$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
            "https://habit-hero-cloudflare.george-stathopoulos.workers.dev/api/habits")
          test "$status" = "401" || { echo "::error::Habits API must block unauthenticated requests (got $status)"; exit 1; }
          echo "Habits UI deployed and anonymous access denied"

      - name: Verify live supervised workflow protection
        if: ${{ vars.HABIT_HERO_CLOUDFLARE_DEPLOY == 'true' }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            "https://habit-hero-cloudflare.george-stathopoulos.workers.dev/habit-hero/parent/" \
            | grep -q 'id="approvalsPanel"'
          for route in activities approvals points; do
            status=$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
              "https://habit-hero-cloudflare.george-stathopoulos.workers.dev/api/$route")
            test "$status" = "401" || { echo "::error::/$route returned HTTP $status to anonymous request"; exit 1; }
          done
          echo "Verified private completion, approval and points endpoints"

      - name: Verify live child-only sign-in and protection
        if: ${{ vars.HABIT_HERO_CLOUDFLARE_DEPLOY == 'true' }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            "https://habit-hero-cloudflare.george-stathopoulos.workers.dev/habit-hero/child/" \
            | grep -q 'id="pairForm"'
          for route in child/me child/activities; do
            status=$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
              "https://habit-hero-cloudflare.george-stathopoulos.workers.dev/api/$route")
            test "$status" = "401" || { echo "::error::Unauthenticated /api/$route returned $status"; exit 1; }
          done
          echo "Verified independent child page and session guards"
