name: Step 9 - Verify and apply D1 schema
on:
  workflow_dispatch:
    inputs:
      messages_only:
        description: Apply only the additive encouragement table after verifying legacy schema
        type: boolean
        default: false
      lifecycle_only:
        description: Apply only reviewed habit lifecycle migration 0008
        type: boolean
        default: false
      notifications_only:
        description: Apply only reviewed notification schema 0009
        type: boolean
        default: false
      routines_only:
        description: Apply only reviewed custom routine schema 0010
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '3fc2c10ca86a2322b58f7daa16c77c6d' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline schema integrity tests (mandatory)
        run: |
          python3 scripts/test-d1-schema.py -v
          node scripts/v3/test-messages.mjs
          node scripts/v3/test-lifecycle.mjs
      - name: Ensure D1 credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Refuse unrelated pending legacy migrations
        if: ${{ inputs.messages_only != true && inputs.lifecycle_only != true && inputs.notifications_only != true && inputs.routines_only != true }}
        working-directory: cloudflare
        run: |
          npx --yes wrangler@4 d1 execute habit-hero-db --remote --command "SELECT name FROM d1_migrations ORDER BY name;" --json > /tmp/hh-applied-migrations.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('/tmp/hh-applied-migrations.json','utf8'));
          const applied=new Set(report.flatMap(part=>part.results||[]).map(row=>row.name));
          const pending=fs.readdirSync('migrations').filter(file=>file.endsWith('.sql')&&!applied.has(file));
          console.log('Pending migrations:',pending);
          if(pending.some(file=>file!=='0007_family_messages.sql'))throw Error('Unrelated legacy migrations require inspection before applying the message table.');
          JS
      - name: Apply reviewed migrations to EU remote D1
        if: ${{ inputs.messages_only != true && inputs.lifecycle_only != true && inputs.notifications_only != true && inputs.routines_only != true }}
        working-directory: cloudflare
        run: printf 'y\n' | npx --yes wrangler@4 d1 migrations apply habit-hero-db --remote
      - name: Verify legacy columns before scoped message migration
        if: ${{ inputs.messages_only == true || inputs.lifecycle_only == true || inputs.notifications_only == true || inputs.routines_only == true }}
        working-directory: cloudflare
        run: |
          npx --yes wrangler@4 d1 execute habit-hero-db --remote --command "PRAGMA table_info(family_settings); PRAGMA table_info(auth_sessions); PRAGMA table_info(parent_users); PRAGMA table_info(habit_help_requests); PRAGMA table_info(completion_submissions); PRAGMA table_info(habits);" --json > /tmp/hh-existing-schema.json || { cat /tmp/hh-existing-schema.json; exit 1; }
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('/tmp/hh-existing-schema.json','utf8'));
          const required=[['timezone'],['pin_verified_at','household_mode'],['pin_hash'],['parent_message'],['slot_index'],['frequency_days_json']];
          const fields=report.map(part=>new Set((part.results||[]).map(row=>row.name)));
          console.log('Inspected schema fields:',fields.map(set=>[...set]));
          if(fields.length!==required.length||required.some((names,index)=>names.some(name=>!fields[index]?.has(name))))throw Error('Existing schema does not match the current Worker. Stop for inspection.');
          JS
      - name: Apply only reviewed message table without replaying legacy migrations
        if: ${{ inputs.messages_only == true || inputs.lifecycle_only == true || inputs.notifications_only == true || inputs.routines_only == true }}
        working-directory: cloudflare
        run: |
          mkdir -p .message-migrations
          if [ "${{ inputs.routines_only }}" = "true" ]; then
            cp migrations/0010_custom_routines.sql .message-migrations/
          elif [ "${{ inputs.notifications_only }}" = "true" ]; then
            cp migrations/0009_notifications.sql .message-migrations/
          elif [ "${{ inputs.lifecycle_only }}" = "true" ]; then
            npx --yes wrangler@4 d1 execute habit-hero-db --remote --command "SELECT name FROM d1_migrations WHERE name='0007_family_messages.sql'; PRAGMA index_list(completion_submissions);" --json > /tmp/hh-lifecycle-prerequisite.json
            node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('/tmp/hh-lifecycle-prerequisite.json'));if(!r[0]?.results?.some(x=>x.name==='0007_family_messages.sql'))throw Error('Message migration must be applied first');"
            cp migrations/0008_habit_lifecycle.sql .message-migrations/
          else
            cp migrations/0007_family_messages.sql .message-migrations/
          fi
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          config.d1_databases=config.d1_databases.map(database=>({...database,migrations_dir:'.message-migrations'}));
          fs.writeFileSync('.messages-wrangler.json',JSON.stringify(config));
          JS
          printf 'y\n' | npx --yes wrangler@4 d1 migrations apply habit-hero-db --remote --config .messages-wrangler.json
      - name: Verify applied schema (read-only)
        working-directory: cloudflare
        run: |
          npx --yes wrangler@4 d1 execute habit-hero-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('families','child_profiles','habit_assignments','point_ledger','auth_sessions','family_messages') ORDER BY name;"
          npx --yes wrangler@4 d1 execute habit-hero-db --remote --command "PRAGMA foreign_key_check;"
